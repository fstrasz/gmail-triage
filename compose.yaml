version: "3"
services:
  gmail-triage:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gmail-triage
    ports:
      - "3000:3000"
    volumes:
      # App files — bind mounted for live reload
      - ./app/triage.js:/app/triage.js
      # Whole lib dir (not individual files) so new modules — atomicWrite.js,
      # senderList.js, oklist.js, and anything added later — are always present
      # without editing this list. A missing per-file mount was silently crashing
      # the app on every deploy that added a lib module.
      - ./app/lib:/app/lib
      # Built React app (gitignored; built on deploy). Bind-mounted so the
      # running container actually contains it — a deploy must force-recreate
      # to pick up this mount (the F24 lesson).
      - ./web/dist:/app/web/dist
      - ./config/activity-log.json:/app/activity-log.json
      # Events of Interest live in SQLite now. Mounted as a DIRECTORY, not a
      # single file: WAL mode writes events.db-wal / events.db-shm beside the
      # database, and under a single-file mount those sidecars would be created
      # in the container's ephemeral layer — leaving a host-side reader (the
      # EventViewer) on a stale database and losing WAL state on recreate.
      - ./config/eventsdb:/app/eventsdb
      # Config & data
      - ./config/.env:/app/.env
      - ./config/credentials.json:/app/credentials.json
      - ./config/token.json:/app/token.json
      - ./config/blocklist.json:/app/blocklist.json
      - ./config/blocklist.backup.json:/app/blocklist.backup.json
      - ./config/blocklist.backups.json:/app/blocklist.backups.json
      - ./config/stats.json:/app/stats.json
      - ./config/keptlist.json:/app/keptlist.json
      - ./config/viplist.json:/app/viplist.json
      - ./config/oklist.json:/app/oklist.json
      - ./config/review.json:/app/review.json
      - ./config/settings.json:/app/settings.json
      - ./config/scan-log.json:/app/scan-log.json
      - ./config/rules.json:/app/rules.json

    stdin_open: true
    tty: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Robin's mailbox: same code, separate state. Behind a profile so it never
  # starts until config-robin/ is seeded -- a single-file bind mount whose host
  # file is missing makes Docker create a DIRECTORY there. deploy.ps1 adds
  # --profile robin only when config-robin/token.json exists on the NAS.
  gmail-triage-robin:
    profiles: ["robin"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gmail-triage-robin
    ports:
      - "3001:3000"
    volumes:
      - ./app/triage.js:/app/triage.js
      - ./app/lib:/app/lib
      - ./web/dist:/app/web/dist
      - ./config-robin/activity-log.json:/app/activity-log.json
      - ./config-robin/eventsdb:/app/eventsdb
      - ./config-robin/.env:/app/.env
      - ./config-robin/credentials.json:/app/credentials.json
      - ./config-robin/token.json:/app/token.json
      - ./config-robin/blocklist.json:/app/blocklist.json
      - ./config-robin/blocklist.backup.json:/app/blocklist.backup.json
      - ./config-robin/blocklist.backups.json:/app/blocklist.backups.json
      - ./config-robin/stats.json:/app/stats.json
      - ./config-robin/keptlist.json:/app/keptlist.json
      - ./config-robin/viplist.json:/app/viplist.json
      - ./config-robin/oklist.json:/app/oklist.json
      - ./config-robin/review.json:/app/review.json
      - ./config-robin/settings.json:/app/settings.json
      - ./config-robin/scan-log.json:/app/scan-log.json
      - ./config-robin/rules.json:/app/rules.json
    stdin_open: true
    tty: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
